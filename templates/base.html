<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ilaaj — AI Health Companion</title>
    <link rel="icon" href="/static/images/doctoricon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* small overrides */
      .glass-card { background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.85)); border-radius: 18px; box-shadow: 0 6px 30px rgba(14,30,37,0.08); }
    </style>
  </head>
  <body class="bg-gradient-to-b from-sky-50 via-white to-sky-50 min-h-screen text-slate-800">
    <header class="py-4">
      <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="/static/images/doctoricon.png" class="w-10 h-10" alt="logo" />
          <div>
            <div class="text-xl font-bold">Ilaaj</div>
            <div class="text-xs text-slate-500">Smart AI Health Assistant</div>
          </div>
        </div>
        <nav class="space-x-6 text-sm">
          <a href="/" class="text-slate-700 hover:text-sky-600">Home</a>
          <a href="/diagnose" class="text-slate-700 hover:text-sky-600">Diagnose</a>
          <a href="/remedies" class="text-slate-700 hover:text-sky-600">Remedies</a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 pb-12">
      {% block content %}{% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto px-6 py-6 text-sm text-slate-500">
      © 2025 Ilaaj — For learning & prototyping only
    </footer>
  </body>
</html>
