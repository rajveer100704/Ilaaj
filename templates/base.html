<!-- templates/base.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ilaaj — AI Health Companion</title>
    <link rel="icon" href="/static/images/doctoricon.png" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-slate-800">
    <header class="bg-white shadow-sm">
      <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="/static/images/doctoricon.png" alt="logo" class="w-10 h-10"/>
          <div>
            <div class="text-xl font-extrabold">Ilaaj</div>
            <div class="text-xs text-gray-500">Smart AI Health Assistant</div>
          </div>
        </div>
        <nav class="space-x-6">
          <a href="/" class="text-sm text-sky-600">Home</a>
          <a href="/diagnose" class="text-sm">Diagnose</a>
          <a href="/remedies" class="text-sm">Remedies</a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      {% block content %}{% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto px-6 py-6 text-sm text-gray-500">
      © 2025 Ilaaj — Built responsibly for learning & prototyping
    </footer>
  </body>
</html>
