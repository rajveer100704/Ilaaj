{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Remedies for: {{ disease }}</h2>
  <div class="muted small">Source: {{ source }}</div>
  <div class="remedy-area" style="margin-top:12px">
    {% if remedies %}
      <pre class="remedy-text">{{ remedies }}</pre>
    {% else %}
      <p>No remedies available.</p>
    {% endif %}
  </div>
  <div style="margin-top:16px">
    <a class="btn" href="{{ url_for('diagnose') }}">← Back to diagnose</a>
  </div>
</section>
{% endblock %}
