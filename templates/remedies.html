<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Remedies | Ilaaj 🩺</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <div>Ilaaj 🩺</div>
  <div>
    <a href="/">Home</a>
    <a href="/diagnose">Diagnose</a>
    <a href="/remedies">Remedies</a>
  </div>
</nav>

<div class="container">
  <h1>AI Remedies & Suggestions</h1>
  <p>Enter symptoms or diseases to get tailored remedies:</p>
  <form id="remedyForm">
    <textarea name="symptoms" rows="3" style="width:100%; border-radius:10px;"></textarea><br><br>
    <button type="submit">💊 Get Remedies</button>
  </form>
  <div id="result" class="result-box" style="display:none;"></div>
</div>

<footer>© 2025 Ilaaj | Smart AI Health Assistant</footer>

<script>
document.getElementById("remedyForm").addEventListener("submit", async(e)=>{
  e.preventDefault();
  const data = new FormData(e.target);
  const res = await fetch("/remedies", {method:"POST", body:data});
  const json = await res.json();
  let html = "<h3>Recommended Remedies:</h3>";
  json.remedies.forEach(r=>{
    html += `<div><b>${r.disease}</b>: ${r.remedies.join(", ")}</div>`;
  });
  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML=html;
});
</script>
</body>
</html>
