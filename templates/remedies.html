{% extends "base.html" %}
{% block content %}
  <h2 class="page-title">Remedies</h2>

  <div class="panel">
    <label for="disease-input">Disease</label>
    <input id="disease-input" type="text" placeholder="Type disease name or open via Diagnose" />

    <div class="actions">
      <button id="fetch-remedies" class="btn primary">Get Remedies</button>
    </div>

    <div id="remedies-area" class="results"></div>
  </div>

  <script>
    // auto-read query param ?disease=
    const params = new URLSearchParams(window.location.search);
    if (params.has("disease")) {
      const d = params.get("disease");
      document.addEventListener("DOMContentLoaded", () => {
        const inp = document.getElementById("disease-input");
        inp.value = decodeURIComponent(d);
        document.getElementById("fetch-remedies").click();
      });
    }
  </script>
{% endblock %}
