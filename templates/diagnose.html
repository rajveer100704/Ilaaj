{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>AI Symptom Diagnosis</h2>
  <p class="muted">Enter symptoms separated by commas (e.g., cough, fever, headache)</p>

  <textarea id="symptoms" placeholder="e.g., fever, cough" rows="3"></textarea>
  <div class="row">
    <button id="diagnoseBtn" class="btn">Diagnose</button>
    <div id="loading" class="muted" style="display:none">Analyzing…</div>
  </div>

  <div id="resultsArea"></div>
</section>

<script>
function createCardHtml(item, idx) {
  const score = item.Score !== undefined ? item.Score.toFixed(1) : (item.Score || 0);
  const disease = item.Disease;
  const encoded = encodeURIComponent(disease);
  return `
    <div class="result-card">
      <div class="result-head">
        <div class="disease">${idx+1}. ${disease}</div>
        <div class="score">${score}%</div>
      </div>
      <div class="score-bar">
        <div class="score-fill" style="width: ${score}%;"></div>
      </div>
      <div class="card-actions">
        <a class="btn small" href="/remedies?disease=${encoded}">Remedies</a>
      </div>
    </div>
  `;
}

document.getElementById("diagnoseBtn").addEventListener("click", async () => {
  const btn = document.getElementById("diagnoseBtn");
  const loading = document.getElementById("loading");
  const resultsArea = document.getElementById("resultsArea");
  const raw = document.getElementById("symptoms").value.trim();
  if (!raw) {
    alert("Please enter symptoms (comma separated).");
    return;
  }

  btn.disabled = true;
  loading.style.display = "inline-block";
  resultsArea.innerHTML = "";

  try {
    // normalize: if user enters comma-separated string, send string
    const payload = { symptoms: raw };

    const resp = await fetch("/api/diagnose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await resp.json();
    if (data.error) {
      resultsArea.innerHTML = `<div class="alert">${data.error}</div>`;
    } else {
      const source = data.source || "db";
      const results = data.results || [];
      if (results.length === 0) {
        resultsArea.innerHTML = `<div class="alert">No results found.</div>`;
      } else {
        // show top 10 cards
        let html = `<div class="results-grid">`;
        results.slice(0,10).forEach((it, i) => {
          html += createCardHtml(it, i);
        });
        html += `</div>`;
        html += `<div class="muted small">Source: ${source}</div>`;
        resultsArea.innerHTML = html;
      }
    }
  } catch (err) {
    console.error(err);
    resultsArea.innerHTML = `<div class="alert">Server error. Try again later.</div>`;
  } finally {
    btn.disabled = false;
    loading.style.display = "none";
  }
});
</script>
{% endblock %}
