{% extends "base.html" %}
{% block content %}
  <h2 class="page-title">AI Diagnosis Assistant</h2>

  <div class="panel">
    <textarea id="symptoms" placeholder="Enter symptoms (comma separated)" rows="6"></textarea>

    <div class="actions">
      <button id="btn-diagnose" class="btn primary">Diagnose (Top 3)</button>
      <button id="btn-full" class="btn">Open Full (Top 10)</button>
    </div>

    <div id="status" class="status"></div>

    <div id="results" class="results hidden"></div>
  </div>
{% endblock %}
