{% extends "base.html" %}
{% block content %}
<h2 style="text-align:center;margin-top:18px;">AI Diagnosis Assistant</h2>

<div class="diagnose-area">
  <textarea id="symptoms" class="text-area" placeholder="Enter symptoms, comma separated..."></textarea>

  <div class="actions">
    <button id="diagnose-btn" class="btn primary">Diagnose (Top 3)</button>
    <button id="openfull-btn" class="btn">Open Full (Top 10)</button>
  </div>

  <div id="status" class="status"></div>

  <div id="results" class="results hidden">
    <!-- results render here -->
  </div>
</div>
<script>
  // allow prefill via ?prefill=
  (function(){
    const params = new URLSearchParams(window.location.search);
    if (params.has('prefill')) {
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('symptoms').value = decodeURIComponent(params.get('prefill'));
      });
    }
  })();
</script>
{% endblock %}
