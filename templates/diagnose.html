{% extends "base.html" %}
{% block content %}
<div class="diagnose-page">
    <h2>AI Symptom Diagnosis</h2>
    <p>Enter your symptoms below to get a possible diagnosis:</p>

    <textarea id="symptoms" rows="4" placeholder="e.g., fever, cough, sore throat"></textarea>
    <button id="diagnoseBtn">Diagnose</button>

    <div id="resultBox"></div>
</div>

<script>
document.getElementById("diagnoseBtn").addEventListener("click", async () => {
    const symptoms = document.getElementById("symptoms").value.trim();
    if (!symptoms) {
        alert("Please enter your symptoms.");
        return;
    }

    try {
        const res = await fetch("/api/diagnose", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ symptoms })
        });

        const data = await res.json();
        if (data.error) {
            document.getElementById("resultBox").innerText = "⚠️ " + data.error;
        } else {
            document.getElementById("resultBox").innerText = "🧠 " + data.result + 
                (data.cached ? " (from cache)" : "");
        }
    } catch (err) {
        console.error(err);
        document.getElementById("resultBox").innerText = "Server error. Try again later.";
    }
});
</script>
{% endblock %}
