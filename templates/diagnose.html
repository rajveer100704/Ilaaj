<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diagnose | Ilaaj 🩺</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <div>Ilaaj 🩺</div>
  <div>
    <a href="/">Home</a>
    <a href="/diagnose">Diagnose</a>
    <a href="/remedies">Remedies</a>
  </div>
</nav>

<div class="container">
  <h1>AI Symptom Diagnosis</h1>
  <p>Enter your symptoms (comma separated):</p>
  <form id="diagnoseForm">
    <textarea name="symptoms" id="symptoms" rows="3" style="width:100%; border-radius:10px;"></textarea><br><br>
    <button type="submit">🔍 Diagnose</button>
  </form>
  <div id="result" class="result-box" style="display:none;"></div>
</div>

<footer>© 2025 Ilaaj | Smart AI Health Assistant</footer>

<script>
document.getElementById("diagnoseForm").addEventListener("submit", async(e)=>{
  e.preventDefault();
  const data = new FormData(e.target);
  const res = await fetch("/diagnose", {method:"POST", body:data});
  const json = await res.json();
  let html = "<h3>Top 10 Possible Diseases:</h3><ul>";
  json.results.forEach(r=>{
    html += `<li><b>${r.disease}</b> — ${r.score}% chance</li>`;
  });
  html += "</ul>";
  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML=html;
});
</script>
</body>
</html>
